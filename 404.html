<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="/css/styles.css?v=30">
</head>
<body>
  <header class="nav" id="site-nav">
    <a class="brand" href="/" data-link></a>
    <nav class="links" id="nav-links"></nav>
    <button type="button" class="theme-btn" id="theme-toggle">Light</button>
    <button type="button" class="sign-in" id="sign-in">Sign in</button>
  </header>

  <div class="site" id="site">
    <div id="heroes"></div>
    <main id="app"></main>
  </div>

  <div class="modal" id="reset-modal" hidden>
    <form class="card" id="reset-form">
      <h2>Reset password</h2>
      <input type="password" id="reset-pass" autocomplete="new-password" placeholder="New password" required>
      <input type="password" id="reset-ok" autocomplete="new-password" placeholder="Confirm password" required>
      <p class="err" id="reset-err" hidden></p>
      <div class="row">
        <button type="submit">Save password</button>
        <button type="button" id="reset-cancel">Cancel</button>
      </div>
    </form>
  </div>
  <div class="modal" id="login-modal" hidden>
    <form class="card" id="login-form">
      <h2>Admin</h2>
      <input type="password" id="login-pass" autocomplete="current-password" required>
      <p class="err" id="login-err" hidden>Wrong password</p>
      <div class="row">
        <button type="submit">Enter</button>
        <button type="button" id="login-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <aside class="admin-bar" id="admin-bar" hidden>
    <div class="admin-row">
      <button type="button" data-act="toggle" id="bar-toggle">Minimize</button>
      <button type="button" data-act="preview" id="preview-toggle">View site</button>
      <div class="admin-tools">
        <button type="button" data-act="add" id="add-toggle">Add</button>
        <button type="button" data-act="store">Store</button>
        <button type="button" data-act="nav">Navbar</button>
        <button type="button" data-act="hero">Settings</button>
        <button type="button" data-act="hero-remove" id="hero-off">Remove hero</button>
        <button type="button" data-act="save">Save</button>
        <button type="button" data-act="export">Export JSON</button>
        <button type="button" data-act="logout">Log out</button>
        <span id="save-msg"></span>
      </div>
    </div>
    <div class="add-extend" id="add-extend">
      <button type="button" data-act="box">Add box</button>
      <button type="button" data-act="text">Add text</button>
      <button type="button" data-act="button">Add button</button>
      <button type="button" data-act="section">Add section</button>
      <button type="button" data-act="hero-add">Add hero banner</button>
    </div>
  </aside>

  <div class="sel-bar" id="sel-bar" hidden>
    <button type="button" data-act="group" id="sel-group">Group</button>
    <button type="button" data-act="ungroup" id="sel-ungroup">Ungroup</button>
  </div>
  <div class="modal" id="confirm-modal" hidden>
    <div class="card">
      <p id="confirm-msg">Do you want to store these items instead?</p>
      <div class="row">
        <button type="button" id="confirm-store">Store</button>
        <button type="button" id="confirm-delete">Delete</button>
        <button type="button" class="ghost" id="confirm-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <div class="modal" id="file-modal" hidden>
    <div class="file-stage">
      <h3 id="file-modal-title">File</h3>
      <button type="button" id="file-modal-close">Close</button>
      <div id="file-modal-body"></div>
    </div>
  </div>
  <div class="drawer" id="drawer" hidden></div>
  <input id="hero-file" type="file" accept="image/*,video/*" hidden>
  <input id="box-file" type="file" accept="image/*" hidden>
  <input id="logo-file" type="file" accept="image/*" hidden>
  <input id="widget-file" type="file" hidden>

  <script type="module" src="/js/main.js?v=30"></script>
</body>
</html>
